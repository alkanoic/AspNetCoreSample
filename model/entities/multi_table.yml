kind: entity
id: multi_table
title: マルチテーブル
table: multi_table
owner: team-sample
description: 複合キー (id + charid) のサンプルテーブル。
key:
  - id
  - charid
auto_events:
  - created
  - updated
  - deleted
fields:
  - { name: id, column: id, type: integer, key: true, required: true, description: マルチID }
  - { name: charid, column: charid, type: string, key: true, required: true, max_length: 10, description: マルチStringId }
  - { name: target_name, column: target_name, type: string, required: true, max_length: 30, description: 名前 }
  - { name: target_int, column: target_int, type: integer, description: int型 }
  - { name: target_decimal, column: target_decimal, type: decimal, description: decimal型 }
  - { name: target_date, column: target_date, type: date, description: 日付型 }
  - { name: target_bit, column: target_bit, type: boolean, description: Bit型 }
  - { name: create_at, column: create_at, type: datetime, required: true, description: 作成日時 }
  - { name: create_user, column: create_user, type: string, required: true, max_length: 20, description: 作成ユーザー }
  - { name: update_at, column: update_at, type: datetime, required: true, description: 更新日時 }
  - { name: update_user, column: update_user, type: string, required: true, max_length: 20, description: 更新ユーザー }
