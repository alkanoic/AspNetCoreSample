name: Build and deploy ASP.Net Core app to Azure Web App

on: push

env:
  MVC_APP_LOCATION: "src/AspNetCoreSample.Mvc"
  MVC_AZURE_WEBAPP_NAME: "WebSampleApp2024" # Azure Web Appの名前
  WEBAPI_APP_LOCATION: "src/AspNetCoreSample.WebApi"
  WEBAPI_AZURE_WEBAPP_NAME: "WebSampleWebApi2024" # Azure Web Appの名前
  NUXT_APP_LOCATION: "/src/NuxtSample/"
  NUXT_AZURE_WEBAPP_NAME: "WebSampleApp2024"
  SPRING_JAVA_VERSION: "21" # Java のバージョン
  SPRING_AZURE_WEBAPP_NAME: "WebSampleSpring2024" # セットアップした Azure Web App の名前
  SPRING_AZURE_WEBAPP_PACKAGE_PATH: "src/SpringBoot.Reports/target" # アプリケーションが存在するフォルダ
  TESTS_DB_LOCATION: "tests/DbContainer.Test"
  TESTS_WEBAPI_LOCATION: "tests/AspNetCoreSample.WebApi.Test"
  TESTS_MVC_LOCATION: "tests/AspNetCoreSample.Mvc.Test"
  TESTS_MVC_CONTAINER_LOCATION: "tests/AspNetCoreSample.Mvc.Container.Test"
  TESTS_GRPC_LOCATION: "tests/AspNetCoreSample.Grpc.Test"
  TESTS_DATAMODEL_LOCATION: "tests/AspNetCoreSample.DataModel.Test"

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22.x"

      - name: Enable pnpm
        run: corepack enable pnpm

      - name: Install NuxtSample dependencies
        working-directory: src/NuxtSample
        run: pnpm install --frozen-lockfile

      - name: Restore dotnet tools and solution
        run: |
          dotnet tool restore
          dotnet restore AspNetCoreSample.sln

      - name: dotnet format check
        run: dotnet format AspNetCoreSample.sln --verify-no-changes

      - name: Nuxt prettier check
        working-directory: src/NuxtSample
        run: pnpm exec prettier --check "app/**/*.{ts,vue,css}"

      - name: Nuxt eslint check
        working-directory: src/NuxtSample
        run: pnpm run lint

      - name: Setup actionlint
        uses: docker://rhysd/actionlint:latest
        with:
          args: -shellcheck= -pyflakes= .github/workflows/main.yml

      - name: markdownlint check (changed files)
        run: |
          BASE="${{ github.event.before }}"
          if [[ "$BASE" =~ ^0+$ || -z "$BASE" ]]; then
            BASE="$(git rev-parse HEAD~1 2>/dev/null || echo HEAD)"
          fi
          CHANGED="$(git diff --name-only "${BASE:-HEAD~1}" HEAD 2>/dev/null | grep '\.md$' || true)"
          if [ -n "$CHANGED" ]; then
            readarray -t MD_LIST <<<"$CHANGED"
            npx --yes markdownlint-cli2 --config .markdownlint.json "${MD_LIST[@]}"
          else
            echo "no changed markdown files"
          fi

      - name: textlint check (changed Japanese markdown)
        run: |
          BASE="${{ github.event.before }}"
          if [[ "$BASE" =~ ^0+$ || -z "$BASE" ]]; then
            BASE="$(git rev-parse HEAD~1 2>/dev/null || echo HEAD)"
          fi
          CHANGED="$(git diff --name-only "${BASE:-HEAD~1}" HEAD 2>/dev/null | grep '\.md$' || true)"
          if [ -n "$CHANGED" ]; then
            JA_MD="$(printf '%s\n' "$CHANGED" | while IFS= read -r f; do
              if grep -qE '[ぁ-んァ-ヶ一-龠]' "$f" 2>/dev/null; then
                printf '%s\n' "$f"
              fi
            done)"
            if [ -n "$JA_MD" ]; then
              readarray -t TL_LIST <<<"$JA_MD"
              npx --yes -p textlint@14 -p textlint-rule-preset-ja-technical-writing@12 textlint --config .textlintrc.json "${TL_LIST[@]}"
            else
              echo "no changed Japanese markdown files"
            fi
          else
            echo "no changed markdown files"
          fi

  dbcontainer_test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: DbContainer Build with dotnet
        run: dotnet build --configuration Release --framework net10.0
        working-directory: ${{ env.TESTS_DB_LOCATION }}

      - name: DbContainer Run tests
        run: dotnet run --project DbContainer.Test.csproj --configuration Release -- --timeout 10m
        working-directory: ${{ env.TESTS_DB_LOCATION }}

  webapi_test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: WebApi Build with dotnet
        run: dotnet build --configuration Release --framework net10.0
        working-directory: ${{ env.TESTS_WEBAPI_LOCATION }}

      - name: WebApi Run tests
        run: dotnet run --project AspNetCoreSample.WebApi.Test.csproj --configuration Release -- --timeout 10m --maximum-parallel-tests 1
        working-directory: ${{ env.TESTS_WEBAPI_LOCATION }}

  mvc_test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Mvc Build with dotnet
        run: dotnet build --configuration Release --framework net10.0
        working-directory: ${{ env.TESTS_MVC_LOCATION }}

      - name: Mvc Run tests
        run: dotnet run --project AspNetCoreSample.Mvc.Test.csproj --configuration Release -- --timeout 10m --treenode-filter "/*/*/*/*[Category=MvcApiTest]"
        working-directory: ${{ env.TESTS_MVC_LOCATION }}

  playwright_test:
    runs-on: ubuntu-latest
    needs: [dbcontainer_test, webapi_test, grpc_test, datamodel_test]

    steps:
      - uses: actions/checkout@v5

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Mvc Container create certificate
        run: bash create_certificate.sh
        working-directory: ${{ env.TESTS_MVC_CONTAINER_LOCATION }}

      - name: Mvc Build with dotnet
        run: dotnet build --configuration Release --framework net10.0
        working-directory: ${{ env.TESTS_MVC_LOCATION }}

      - name: Mvc Container Build with dotnet
        run: dotnet build --configuration Release --framework net10.0
        working-directory: ${{ env.TESTS_MVC_CONTAINER_LOCATION }}

      - name: playwright install for mvc
        run: pwsh bin/Release/net10.0/playwright.ps1 install --with-deps
        working-directory: ${{ env.TESTS_MVC_LOCATION }}

      - name: playwright install for mvc container
        run: pwsh bin/Release/net10.0/playwright.ps1 install --with-deps
        working-directory: ${{ env.TESTS_MVC_CONTAINER_LOCATION }}

      - name: Mvc Playwright tests
        run: dotnet run --project AspNetCoreSample.Mvc.Test.csproj --configuration Release -- --timeout 10m --treenode-filter "/*/*/*/*[Category=MvcInProcessTest]"
        working-directory: ${{ env.TESTS_MVC_LOCATION }}

      - name: Mvc Container Playwright tests
        run: dotnet run --project AspNetCoreSample.Mvc.Container.Test.csproj --configuration Release -- --timeout 15m
        working-directory: ${{ env.TESTS_MVC_CONTAINER_LOCATION }}

  grpc_test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Grpc Build with dotnet
        run: dotnet build --configuration Release --framework net10.0
        working-directory: ${{ env.TESTS_GRPC_LOCATION }}

      - name: Grpc Run tests
        run: dotnet run --project AspNetCoreSample.Grpc.Test.csproj --configuration Release -- --timeout 10m
        working-directory: ${{ env.TESTS_GRPC_LOCATION }}

  datamodel_test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: DataModel Build with dotnet
        run: dotnet build --configuration Release --framework net10.0
        working-directory: ${{ env.TESTS_DATAMODEL_LOCATION }}

      - name: DataModel Run tests
        run: dotnet run --project AspNetCoreSample.DataModel.Test.csproj --configuration Release -- --timeout 10m
        working-directory: ${{ env.TESTS_DATAMODEL_LOCATION }}

  coverage_report:
    runs-on: ubuntu-latest
    needs: [dbcontainer_test, webapi_test, mvc_test, playwright_test, grpc_test, datamodel_test]
    if: always()

    steps:
      - uses: actions/checkout@v5

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install ReportGenerator
        run: dotnet tool install --global dotnet-reportgenerator-globaltool --version 5.5.11

      - name: Generate empty coverage report
        run: |
          mkdir -p coveragereport
          echo "# Coverage Report" > coveragereport/SummaryGithub.md
          echo "Coverage collection is disabled after migrating to TUnit / Microsoft.Testing.Platform." >> coveragereport/SummaryGithub.md

      - name: Upload coverage report artifact
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: coveragereport
          retention-days: 30

      - name: Add coverage summary to job
        run: |
          if [ -f coveragereport/SummaryGithub.md ]; then
            cat coveragereport/SummaryGithub.md >> $GITHUB_STEP_SUMMARY
          fi

  mvc:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: [dbcontainer_test, webapi_test, mvc_test, playwright_test, grpc_test, datamodel_test]

    steps:
      - uses: actions/checkout@v5

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: npm install
        run: npm ci
        working-directory: ${{ env.MVC_APP_LOCATION }}

      - name: vite publish
        run: npm run publish
        working-directory: ${{ env.MVC_APP_LOCATION }}

      - name: Build with dotnet
        run: dotnet build --configuration Release --framework net10.0
        working-directory: ${{ env.MVC_APP_LOCATION }}

      - name: Publish app for deployment
        run: |
          dotnet publish -c Release -o published --framework net10.0
        working-directory: ${{ env.MVC_APP_LOCATION }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ env.MVC_AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.MVC_AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ env.MVC_APP_LOCATION }}/published

  webapi:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: [dbcontainer_test, webapi_test, mvc_test, playwright_test, grpc_test, datamodel_test]

    steps:
      - uses: actions/checkout@v5

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build with dotnet
        run: dotnet build --configuration Release --framework net10.0
        working-directory: ${{ env.WEBAPI_APP_LOCATION }}

      - name: Publish app for deployment
        run: |
          dotnet publish -c Release -o published --framework net10.0
        working-directory: ${{ env.WEBAPI_APP_LOCATION }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ env.WEBAPI_AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.WEBAPI_AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ env.WEBAPI_APP_LOCATION }}/published

  nuxt:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: [dbcontainer_test, webapi_test, mvc_test, playwright_test, grpc_test, datamodel_test]

    steps:
      - uses: actions/checkout@v5

      - name: setup node
        uses: actions/setup-node@v5
        with:
          node-version: "22.x"

      - name: enable pnpm
        run: corepack enable pnpm

      - name: install modules
        working-directory: src/NuxtSample
        run: pnpm install --frozen-lockfile

      - name: generate nuxt
        working-directory: src/NuxtSample
        run: pnpm run generate

      - name: Build And Deploy To Azure
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "src/NuxtSample/.output/public"

  spring:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: [dbcontainer_test, webapi_test, mvc_test, playwright_test, grpc_test, datamodel_test]

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK ${{ env.SPRING_JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.SPRING_JAVA_VERSION }}
          distribution: "temurin"

      - name: Build with Maven
        run: mvn clean install
        working-directory: src/SpringBoot.Reports

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v6
        with:
          name: java-app
          path: ${{ env.SPRING_AZURE_WEBAPP_PACKAGE_PATH }}

      - name: Download artifact from build job
        uses: actions/download-artifact@v7
        with:
          name: java-app
          path: ${{ env.SPRING_AZURE_WEBAPP_PACKAGE_PATH }}

      - name: Azure WebApp
        id: azure-webapp
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ env.SPRING_AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.SPRING_AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ env.SPRING_AZURE_WEBAPP_PACKAGE_PATH }}

  docs:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: [dbcontainer_test, webapi_test, mvc_test, playwright_test, grpc_test, datamodel_test]

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MkDocs dependencies
        run: pip install -r requirements.txt

      - name: Build MkDocs site
        run: mkdocs build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
